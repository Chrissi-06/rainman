<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rainman</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="page">

  <div class="hero">
    <img src="Rainman.png" alt="Rainman" class="hero-img">
  </div>

  <h1>Rainman</h1>

  <div class="status-bar" id="statusBar">Loading...</div>

  <div class="controls">
    <button id="pushButton" type="button" onclick="enablePush()">Benachrichtigungen aktivieren</button>
    <span id="pushStatus"></span>
    <br><br>
    Show last:
    <select id="minutes" onchange="loadData()">
      <option value="10">10 Minuten</option>
      <option value="60" selected>1 Stunde</option>
      <option value="360">6 Stunden</option>
      <option value="1440">24 Stunden</option>
    </select>
  </div>

  <div class="chart-wrapper">
    <canvas id="mainChart"></canvas>
  </div>

</div>

<script>
  const DEVICE_ID = 'arduino-a';
  const SOUND_SCALE = 100 / 3.3;

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
  }

  async function updatePushStatus() {
    const button = document.getElementById('pushButton');
    const status = document.getElementById('pushStatus');

    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      button.disabled = true;
      status.textContent = 'Push wird von diesem Browser nicht unterstützt.';
      return;
    }

    if (Notification.permission === 'granted') {
      status.textContent = 'Benachrichtigungen sind aktiviert.';
    } else if (Notification.permission === 'denied') {
      status.textContent = 'Benachrichtigungen wurden blockiert.';
    }
  }

  async function enablePush() {
    const button = document.getElementById('pushButton');
    const status = document.getElementById('pushStatus');

    try {
      button.disabled = true;
      status.textContent = 'Wird eingerichtet...';

      const registration = await navigator.serviceWorker.register('/sw.js');
      const permission = await Notification.requestPermission();

      if (permission !== 'granted') {
        throw new Error('Benachrichtigungsberechtigung wurde nicht erteilt.');
      }

      const keyResponse = await fetch('/api/push/public-key');
      const { publicKey } = await keyResponse.json();

      let subscription = await registration.pushManager.getSubscription();

      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey)
        });
      }

      const subscriptionJson = subscription.toJSON();

      const response = await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(subscriptionJson)
      });

      if (!response.ok) {
        throw new Error('Server konnte die Push-Anmeldung nicht speichern.');
      }

      status.textContent = 'Benachrichtigungen sind aktiviert.';
    } catch (error) {
      console.error(error);
      status.textContent = error.message;
      button.disabled = false;
    }
  }

  updatePushStatus();

  let mainChart;

  const rainShadingPlugin = {
    id: 'rainShading',
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const xScale = scales.x;
      const rainingData = chart.data.datasets[4].data;
      if (!rainingData.length) return;

      ctx.save();
      ctx.fillStyle = 'rgba(100, 180, 255, 0.18)';

      let inRain = false;
      let rainStart = null;

      for (let i = 0; i < rainingData.length; i++) {
        const isRaining = rainingData[i] === 1;
        if (isRaining && !inRain) {
          rainStart = xScale.getPixelForValue(i);
          inRain = true;
        } else if (!isRaining && inRain) {
          ctx.fillRect(rainStart, chartArea.top, xScale.getPixelForValue(i) - rainStart, chartArea.height);
          inRain = false;
        }
      }
      if (inRain) {
        ctx.fillRect(rainStart, chartArea.top, xScale.getPixelForValue(rainingData.length - 1) - rainStart, chartArea.height);
      }
      ctx.restore();
    }
  };

  function calcMin(values) { return Math.min(0, Math.floor(Math.min(...values)) - 2); }
  function calcMax(values) { return Math.max(100, Math.ceil(Math.max(...values)) + 2); }

  function initChart() {
    mainChart = new Chart(document.getElementById('mainChart'), {
      type: 'line',
      plugins: [rainShadingPlugin],
      data: {
        labels: [],
        datasets: [
          { label: 'Temperatur (°C)', data: [], borderColor: '#e74c3c', tension: 0.2, pointRadius: 0 },
          { label: 'Luftfeuchte (%)', data: [], borderColor: '#3498db', tension: 0.2, pointRadius: 0 },
          { label: 'relativer Geräuschpegel', data: [], borderColor: '#9b59b6', tension: 0.2, pointRadius: 0 },
          { label: 'Regensicherheit (%)', data: [], borderColor: '#27ae60', tension: 0.2, pointRadius: 0 },
          { label: 'Regen', data: [], hidden: true, pointRadius: 0 }
        ]
      },
      options: {
        animation: false,
        plugins: {
          title: { display: false },
          legend: { labels: { filter: item => item.text !== 'Regen' } }
        },
        scales: {
          x: { ticks: { maxTicksLimit: 10 } },
          y: { min: 0, max: 100 }
        }
      }
    });
  }

  async function loadStatus() {
    const res = await fetch('/api/devices');
    const devices = await res.json();
    const d = devices.find(d => d.id === DEVICE_ID);
    if (!d) return;
    const bar = document.getElementById('statusBar');
    bar.textContent = d.status === 'offline' ? 'Rainman macht gerade Pause...'
            : d.status === 'true'    ? 'Es regnet!'
                    : 'Es ist trocken.';
    bar.className = 'status-bar ' + (d.status === 'offline' ? 'offline'
            : d.status === 'true'    ? 'raining' : 'clear');
  }

  async function loadData() {
    const minutes = document.getElementById('minutes').value;
    const res = await fetch(`/api/data/${DEVICE_ID}?minutes=${minutes}`);
    const rows = await res.json();

    const labels  = rows.map(r => new Date(r.recorded_at).toLocaleTimeString());
    const temps   = rows.map(r => r.air_temp);
    const hums    = rows.map(r => r.air_hum);
    const sounds  = rows.map(r => parseFloat((r.sound_v * SOUND_SCALE).toFixed(1)));
    const rain    = rows.map(r => r.rain_prob);
    const raining = rows.map(r => r.raining);

    const all = [...temps, ...hums, ...sounds, ...rain];
    if (all.length) {
      mainChart.options.scales.y.min = calcMin(all);
      mainChart.options.scales.y.max = calcMax(all);
    }

    mainChart.data.labels = labels;
    mainChart.data.datasets[0].data = temps;
    mainChart.data.datasets[1].data = hums;
    mainChart.data.datasets[2].data = sounds;
    mainChart.data.datasets[3].data = rain;
    mainChart.data.datasets[4].data = raining;
    mainChart.update();
  }

  async function refresh() {
    await loadStatus();
    await loadData();
  }

  initChart();
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
