<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Device Data</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<p><a href="/">← Back</a></p>
<h1 id="deviceTitle"></h1>

<div class="controls">
    Show last:
    <select id="minutes" onchange="loadData()">
        <option value="10">10 minutes</option>
        <option value="60" selected>1 hour</option>
        <option value="360">6 hours</option>
        <option value="1440">24 hours</option>
    </select>
</div>

<div class="chart-wrapper">
    <canvas id="mainChart"></canvas>
</div>

<script>
    const SOUND_SCALE = 100 / 3.3;
    const deviceId = window.location.pathname.split('/').pop();
    document.getElementById('deviceTitle').textContent = deviceId;

    let mainChart;

    // Plugin that draws light-blue background where raining=1
    const rainShadingPlugin = {
        id: 'rainShading',
        beforeDraw(chart) {
            const { ctx, chartArea, scales } = chart;
            const xScale = scales.x;
            const rainData = chart.data.datasets[4].data; // raining dataset
            const labels = chart.data.labels;
            if (!rainData.length) return;

            ctx.save();
            ctx.fillStyle = 'rgba(100, 180, 255, 0.18)';

            let inRain = false;
            let rainStart = null;

            for (let i = 0; i < rainData.length; i++) {
                const isRaining = rainData[i] === 1;
                if (isRaining && !inRain) {
                    rainStart = xScale.getPixelForValue(i);
                    inRain = true;
                } else if (!isRaining && inRain) {
                    const rainEnd = xScale.getPixelForValue(i);
                    ctx.fillRect(rainStart, chartArea.top, rainEnd - rainStart, chartArea.height);
                    inRain = false;
                }
            }
            // Close any open rain period at end
            if (inRain) {
                const rainEnd = xScale.getPixelForValue(rainData.length - 1);
                ctx.fillRect(rainStart, chartArea.top, rainEnd - rainStart, chartArea.height);
            }
            ctx.restore();
        }
    };

    function calcAxisMin(values, hardMin = 0) {
        return Math.min(hardMin, Math.floor(Math.min(...values)) - 2);
    }
    function calcAxisMax(values, hardMax = 100) {
        return Math.max(hardMax, Math.ceil(Math.max(...values)) + 2);
    }

    function initCharts() {
        mainChart = new Chart(document.getElementById('mainChart'), {
            type: 'line',
            plugins: [rainShadingPlugin],
            data: {
                labels: [],
                datasets: [
                    { label: 'Temperature (°C)', data: [], borderColor: '#e74c3c', tension: 0.2, pointRadius: 0 },
                    { label: 'Humidity (%)',      data: [], borderColor: '#3498db', tension: 0.2, pointRadius: 0 },
                    { label: 'Sound Level',      data: [], borderColor: '#9b59b6', tension: 0.2, pointRadius: 0 },
                    { label: 'Rain Probability (%)', data: [], borderColor: '#27ae60', tension: 0.2, pointRadius: 0 },
                    // Hidden dataset just for shading logic — not shown in graph
                    { label: 'Raining', data: [], hidden: true, pointRadius: 0 }
                ]
            },
            options: {
                animation: false,
                plugins: {
                    title: { display: true, text: 'Temperature, Humidity, Sound & Rain Probability' },
                    legend: {
                        labels: {
                            filter: item => item.text !== 'Raining' // hide from legend
                        }
                    }
                },
                scales: {
                    x: { ticks: { maxTicksLimit: 10 } },
                    y: { min: 0, max: 100 }
                }
            }
        });
    }

    async function loadData() {
        const minutes = document.getElementById('minutes').value;
        const res = await fetch(`/api/data/${deviceId}?minutes=${minutes}`);
        const rows = await res.json();

        const labels = rows.map(r => new Date(r.recorded_at).toLocaleTimeString());
        const temps  = rows.map(r => r.air_temp);
        const hums   = rows.map(r => r.air_hum);
        const sounds = rows.map(r => parseFloat((r.sound_v * SOUND_SCALE).toFixed(1)));
        const rain   = rows.map(r => r.rain_prob);
        const raining = rows.map(r => r.raining);

        const allValues = [...temps, ...hums, ...sounds, ...rain];
        mainChart.options.scales.y.min = calcAxisMin(allValues);
        mainChart.options.scales.y.max = calcAxisMax(allValues);

        mainChart.data.labels = labels;
        mainChart.data.datasets[0].data = temps;
        mainChart.data.datasets[1].data = hums;
        mainChart.data.datasets[2].data = sounds;
        mainChart.data.datasets[3].data = rain;
        mainChart.data.datasets[4].data = raining;
        mainChart.update();
    }

    initCharts();
    loadData();
    setInterval(loadData, 10000);
</script>
</body>
</html>
