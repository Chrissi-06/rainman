<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Device Data</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<p><a href="/">← Back</a></p>
<h1 id="deviceTitle"></h1>

<div class="controls">
    Show last:
    <select id="minutes" onchange="loadData()">
        <option value="10">10 minutes</option>
        <option value="60" selected>1 hour</option>
        <option value="360">6 hours</option>
        <option value="1440">24 hours</option>
    </select>
</div>

<canvas id="mainChart"></canvas>
<canvas id="rainChart"></canvas>

<script>
    const SOUND_SCALE = 100 / 3.3;
    const deviceId = window.location.pathname.split('/').pop();
    document.getElementById('deviceTitle').textContent = deviceId;

    let mainChart, rainChart;

    function calcAxisRange(values, hardMin = 0, hardMax = 100) {
        const dataMin = Math.min(...values);
        const dataMax = Math.max(...values);
        return {
            min: Math.min(hardMin, Math.floor(dataMin) - 2),
            max: Math.max(hardMax, Math.ceil(dataMax) + 2)
        };
    }

    function initCharts() {
        const commonOptions = {
            animation: false,
            scales: { x: { ticks: { maxTicksLimit: 10 } } }
        };

        mainChart = new Chart(document.getElementById('mainChart'), {
            type: 'line',
            data: { labels: [], datasets: [
                    { label: 'Temperature (°C)', data: [], borderColor: '#e74c3c', tension: 0.2, pointRadius: 0 },
                    { label: 'Humidity (%)',      data: [], borderColor: '#3498db', tension: 0.2, pointRadius: 0 },
                    { label: 'Sound Level',      data: [], borderColor: '#9b59b6', tension: 0.2, pointRadius: 0 }
                ]},
            options: {
                ...commonOptions,
                plugins: { title: { display: true, text: 'Temperature, Humidity & Sound Level' } },
                scales: {
                    x: { ticks: { maxTicksLimit: 10 } },
                    y: { min: 0, max: 100 }
                }
            }
        });

        rainChart = new Chart(document.getElementById('rainChart'), {
            type: 'line',
            data: { labels: [], datasets: [
                    { label: 'Rain Probability (%)', data: [], borderColor: '#2ecc71', tension: 0.2, pointRadius: 0 }
                ]},
            options: {
                ...commonOptions,
                plugins: { title: { display: true, text: 'Rain Probability' } },
                scales: {
                    x: { ticks: { maxTicksLimit: 10 } },
                    y: { min: 0, max: 100 }
                }
            }
        });
    }

    async function loadData() {
        const minutes = document.getElementById('minutes').value;
        const res = await fetch(`/api/data/${deviceId}?minutes=${minutes}`);
        const rows = await res.json();

        const labels = rows.map(r => new Date(r.recorded_at).toLocaleTimeString());
        const temps  = rows.map(r => r.air_temp);
        const hums   = rows.map(r => r.air_hum);
        const sounds = rows.map(r => parseFloat((r.sound_v * SOUND_SCALE).toFixed(1)));
        const rain   = rows.map(r => r.rain_prob);

        // Calculate y-axis range: default 0-100, widen only if data goes outside
        const allMainValues = [...temps, ...hums, ...sounds];
        const { min: mainMin, max: mainMax } = calcAxisRange(allMainValues);
        mainChart.options.scales.y.min = mainMin;
        mainChart.options.scales.y.max = mainMax;

        mainChart.data.labels = labels;
        mainChart.data.datasets[0].data = temps;
        mainChart.data.datasets[1].data = hums;
        mainChart.data.datasets[2].data = sounds;
        mainChart.update();

        const { min: rainMin, max: rainMax } = calcAxisRange(rain);
        rainChart.options.scales.y.min = rainMin;
        rainChart.options.scales.y.max = rainMax;

        rainChart.data.labels = labels;
        rainChart.data.datasets[0].data = rain;
        rainChart.update();
    }

    initCharts();
    loadData();
    setInterval(loadData, 10000);
</script>
</body>
</html>
